name: daily-health-check
on:
  schedule:
    - cron: "0 1 * * *"  # 每天 09:00 北京时间
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/health_check.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily health check"
          file_pattern: public/health.json
